[project]
name = "cardio-ia"
version = "0.1.0"
description = "Sistema preditivo multiagente para eventos cardíacos (FIAP CardioIA Fase 6)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.0.19",
    "openai>=1.60.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
cardio-ia-run = "cardio_ia.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
